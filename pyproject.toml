[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "understanding-pi0"
version = "0.1.0"
description = "SmolVLA MX quantization + IREE export workspace"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "lerobot[smolvla]",
  "torchao==0.16.*",
  "ml-dtypes",
  "safetensors",
]

[project.optional-dependencies]
export_iree = [
  "iree-turbine",
]

[tool.uv]
# evdev >=1.9 ships pre-generated ecodes referencing Linux 6.11+ constants
# (KEY_ACCESSIBILITY, KEY_DO_NOT_DISTURB) that fail to compile on older kernels.
# Cap to <1.9 so uv resolves a version that builds everywhere.
constraint-dependencies = ["evdev<1.9"]

[tool.uv.sources]
lerobot = { path = "../lerobot", editable = true }