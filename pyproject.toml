[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "understanding-pi0"
version = "0.1.0"
description = "SmolVLA MX quantization + IREE export workspace"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "lerobot[smolvla]",
  "torchao==0.16.*",
  "ml-dtypes",
  "safetensors",
]

[project.optional-dependencies]
export_iree = [
  "iree-turbine",
]

[tool.uv]
# evdev is pulled in by lerobot -> pynput -> evdev (Linux only).
# It is only needed for physical input-device handling, not MLIR export.
# evdev generates ecodes.c from system kernel headers at build time, but the
# conda cross-compiler uses its own sysroot with older headers — causing
# undeclared-symbol errors (KEY_ACCESSIBILITY, KEY_DO_NOT_DISTURB, etc.)
# regardless of evdev version.  Override the marker so it never resolves.
override-dependencies = ["evdev ; sys_platform == 'none'"]

[tool.uv.sources]
lerobot = { path = "../lerobot", editable = true }